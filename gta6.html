<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI: cronología de un fenómeno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  @property --sky-top { syntax: '<color>'; inherits: true; initial-value: #0b0a24; }
  @property --sky-mid { syntax: '<color>'; inherits: true; initial-value: #1b1650; }
  @property --sky-low { syntax: '<color>'; inherits: true; initial-value: #2e2368; }

  :root {
    --water: #100b26;
    --water-deep: #0a0719;
    --ivory: #fff4e8;
    --muted: rgba(255, 244, 232, .70);
    --faint: rgba(255, 244, 232, .42);
    --horizon: 158px;
    --sun-y: 46px;
    --c-estudio: #8fd3ff;
    --c-filtraciones: #ff6474;
    --c-marketing: #ff9ad5;
    --c-fechas: #ffc857;
    --c-negocio: #7fe3a5;
    --c-estreno: #c9b6ff;
    --cat: var(--c-estudio);
    --ff: "Archivo", "Roboto", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--water-deep); }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ff); color: var(--ivory);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .player {
    position: relative;
    width: 350px; height: 450px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--water) 0%, var(--water-deep) 100%);
    isolation: isolate;
  }

  /* Cielo: cambia de noche a amanecer a medida que avanza la cronología */
  .sky {
    position: absolute; inset: 0 0 auto 0; height: var(--horizon);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-low) 100%);
    transition: --sky-top .7s ease, --sky-mid .7s ease, --sky-low .7s ease;
    z-index: -2;
  }
  .sun {
    position: absolute; right: 38px; top: calc(var(--horizon) - 34px);
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #fff1c9 0%, #ffd07a 45%, #ff9a52 100%);
    box-shadow: 0 0 40px 10px rgba(255, 160, 90, .35);
    transform: translateY(var(--sun-y));
    transition: transform .7s ease, opacity .7s ease;
    z-index: -1;
  }
  .water {
    position: absolute; inset: var(--horizon) 0 0 0;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--sky-low) 38%, var(--water)) 0px, var(--water) 22px, var(--water-deep) 100%);
    transition: --sky-low .7s ease;
    z-index: -1;
  }
  .water::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: color-mix(in srgb, var(--sky-low) 80%, white);
    opacity: .7;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 14px 16px 0;
  }
  h1 {
    font-weight: 800; font-stretch: 78%;
    font-size: 21px; line-height: 1.08; letter-spacing: -.005em;
    max-width: 220px;
    text-wrap: balance;
  }
  .btn {
    font: inherit; color: inherit; cursor: pointer;
    background: rgba(10, 7, 25, .38);
    border: 1px solid rgba(255, 244, 232, .28);
    border-radius: 999px;
    transition: background .2s, border-color .2s;
  }
  .btn:hover { background: rgba(10, 7, 25, .6); border-color: rgba(255, 244, 232, .5); }
  .btn:focus-visible, .track:focus-visible { outline: 2px solid var(--ivory); outline-offset: 2px; }
  .index-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px 6px 9px; font-size: 12.5px; font-weight: 600;
    white-space: nowrap; flex-shrink: 0;
  }
  .index-btn svg { width: 13px; height: 13px; }

  /* Año: la cifra grande se apoya en el horizonte */
  .year {
    position: absolute; left: 12px; top: calc(var(--horizon) - 62px);
    font-weight: 900; font-stretch: 62%;
    font-size: 82px; line-height: 1; letter-spacing: -.02em;
    color: var(--ivory);
    text-shadow: 0 2px 18px rgba(10, 7, 25, .35);
    pointer-events: none;
    font-variant-numeric: lining-nums;
  }

  .card {
    position: absolute; left: 0; right: 0; top: 184px; bottom: 66px;
    padding: 0 16px;
    display: flex; flex-direction: column;
    touch-action: pan-y;
    user-select: none; -webkit-user-select: none;
  }
  .meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 7px;
  }
  .cat {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--cat); font-weight: 650;
  }
  .cat::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat);
  }
  .meta .when { font-variant-numeric: tabular-nums; }
  .title {
    font-weight: 800; font-stretch: 88%;
    font-size: 18.5px; line-height: 1.15; letter-spacing: -.005em;
    margin-bottom: 7px;
    text-wrap: balance;
  }
  .body {
    font-size: 13.2px; line-height: 1.45; color: rgba(255, 244, 232, .9);
    font-stretch: 92%;
    overflow-y: auto; flex: 1 1 auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: rgba(255,244,232,.3) transparent;
    padding-right: 2px;
  }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    margin-top: 6px; flex-shrink: 0;
  }
  .source { font-size: 11px; color: var(--faint); }
  .counter { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Navegación inferior */
  .nav {
    position: absolute; left: 0; right: 0; bottom: 0; height: 66px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 6px;
    border-top: 1px solid rgba(255, 244, 232, .1);
    background: rgba(10, 7, 25, .55);
  }
  .arrow {
    width: 34px; height: 34px; flex-shrink: 0;
    display: grid; place-items: center;
  }
  .arrow svg { width: 15px; height: 15px; }
  .arrow:disabled { opacity: .3; cursor: default; }
  .arrow:disabled:hover { background: rgba(10, 7, 25, .38); border-color: rgba(255, 244, 232, .28); }

  .scrub { flex: 1; position: relative; height: 50px; }
  .track {
    position: absolute; left: 0; right: 0; top: 6px; height: 28px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; touch-action: none; border-radius: 4px;
  }
  .tick {
    flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .tick i {
    display: block; width: 3px; height: 13px; border-radius: 2px;
    background: var(--tc); opacity: .9;
    transition: height .2s ease, width .2s ease, opacity .2s ease, background .2s;
  }
  .tick.future i { opacity: .38; }
  .tick.on i { width: 5px; height: 26px; opacity: 1; background: var(--ivory); box-shadow: 0 0 0 2px var(--tc); }
  .years {
    position: absolute; left: 0; right: 0; top: 36px; height: 12px;
    font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums;
  }
  .years span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

  /* Índice */
  .index {
    position: absolute; left: 0; right: 0; top: 64px; bottom: 0;
    background: var(--water-deep);
    border-top: 1px solid rgba(255, 244, 232, .14);
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
    z-index: 5;
  }
  .index.open { opacity: 1; visibility: visible; transform: none; transition: opacity .22s ease, transform .22s ease; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    padding: 10px 16px 9px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid rgba(255, 244, 232, .1);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
  .index ol { list-style: none; overflow-y: auto; flex: 1; padding: 4px 0 10px; scrollbar-width: thin; scrollbar-color: rgba(255,244,232,.3) transparent; }
  .index li button {
    width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    display: grid; grid-template-columns: 38px 1fr; gap: 0 10px; align-items: baseline;
    padding: 7px 16px 7px 13px;
    border-left: 3px solid transparent;
  }
  .index li button:hover { background: rgba(255, 244, 232, .06); }
  .index li button:focus-visible { outline: 2px solid var(--ivory); outline-offset: -2px; }
  .index li button[aria-current="true"] { border-left-color: var(--ic); background: rgba(255, 244, 232, .07); }
  .index .iy { font-weight: 800; font-stretch: 70%; font-size: 15px; color: var(--ic); font-variant-numeric: tabular-nums; }
  .index .it { font-size: 13px; line-height: 1.3; }
  .index .id { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

<div class="player" id="player">
  <div class="sky" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="water" aria-hidden="true"></div>

  <header>
    <h1>GTA VI: cronología de un fenómeno</h1>
    <button class="btn index-btn" id="indexBtn" aria-expanded="false" aria-controls="index">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      <span id="indexLabel">Índice</span>
    </button>
  </header>

  <div class="year" id="year" aria-hidden="true">2013</div>

  <article class="card" id="card" aria-live="polite">
    <div class="meta"><span class="cat" id="cat"></span><span class="when" id="when"></span></div>

    <div class="foot"><p class="source" id="source"></p><span class="counter" id="counter"></span></div>

    <div class="scrub">

    <button class="btn arrow" id="next" aria-label="Hito siguiente">

    </button>
  </nav>

  <section class="index" id="index" aria-label="Índice de hitos">
    <div class="legend" id="legend"></div>
    <ol id="list"></ol>
  </section>
</div>

      b: "Trece años y dos meses después de GTA V, el juego se lanza en PS5 y Xbox Series X|S, con un despliegue a medianoche según la zona horaria de cada país. La versión de PC sigue sin fecha anunciada.",
      s: "Rockstar Games" },
    { y: "2026", d: "19 de noviembre", c: "negocio",
      t: "US$ 1.840 millones al día del estreno",
      b: "La consultora Sensor Tower estima 19 millones de copias vendidas al día del lanzamiento, más del doble de lo que facturó GTA V en su primer día. Un 75% corresponde a PlayStation. Take-Two aún no entrega cifras oficiales.",
      s: "Sensor Tower vía Forbes" }
  ];

  // Cielo: de la noche (2013) al amanecer (2026)
  var SKY = [
    [0.00, ["#0b0a24", "#1b1650", "#2e2368"]],
    [0.45, ["#140e38", "#3b1a62", "#7a2a72"]],
    [0.75, ["#1d0f45", "#6e2068", "#c23a6c"]],
    [1.00, ["#2a1052", "#a42a6a", "#f27a3e"]]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var player = $("player"), card = $("card"), track = $("track");
  var yearEl = $("year"), indexEl = $("index"), indexBtn = $("indexBtn");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var N = H.length, cur = -1;

  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function mix(a, b, t) {
    var A = hex(a), B = hex(b);
    return "rgb(" + A.map(function (v, i) { return Math.round(v + (B[i] - v) * t); }).join(",") + ")";
  }
  function skyAt(p) {
    for (var i = 1; i < SKY.length; i++) {
      if (p <= SKY[i][0]) {
        var a = SKY[i - 1], b = SKY[i], t = (p - a[0]) / (b[0] - a[0]);
        return a[1].map(function (c, k) { return mix(c, b[1][k], t); });
      }
    }
    return SKY[SKY.length - 1][1];
  }
  function catColor(c) { return "var(--c-" + c + ")"; }

  // Marcas del deslizador
  H.forEach(function (h, i) {
    var t = document.createElement("span");
    t.className = "tick";
    t.style.setProperty("--tc", catColor(h.c));
    t.appendChild(document.createElement("i"));
    track.appendChild(t);
  });
  var ticks = track.children;

  // Etiquetas de año bajo el deslizador (primer hito de cada año, sin choques)
  var labels = { "2013": 1, "2018": 1, "2022": 1, "2023": 1, "2024": 1, "2025": 1, "2026": 1 };
  var seen = {};
  H.forEach(function (h, i) {
    if (labels[h.y] && !seen[h.y]) {
      seen[h.y] = 1;
      var s = document.createElement("span");
      s.textContent = "’" + h.y.slice(2);
      s.style.left = ((i + 0.5) / N * 100) + "%";
      $("years").appendChild(s);
    }
  });

  // Leyenda e índice
  Object.keys(CATS).forEach(function (k) {
    var s = document.createElement("span");
    s.textContent = CATS[k];
    s.style.setProperty("--lc", catColor(k));
    $("legend").appendChild(s);
  });
  H.forEach(function (h, i) {
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    b.style.setProperty("--ic", catColor(h.c));
    b.innerHTML = '<span class="iy"></span><span class="it"></span>';
    b.querySelector(".iy").textContent = h.y;
    b.querySelector(".it").textContent = h.t;
    var dd = document.createElement("span");
    dd.className = "id";
    dd.textContent = h.d;
    b.querySelector(".it").appendChild(dd);
    b.addEventListener("click", function () { go(i); toggleIndex(false); });
    li.appendChild(b);
    $("list").appendChild(li);
  });
  var listButtons = $("list").querySelectorAll("button");

  function go(i, fromDrag) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === cur) return;
    var dir = cur < 0 ? 0 : (i > cur ? 1 : -1);
    var prevYear = cur < 0 ? null : H[cur].y;
    cur = i;
    var h = H[i];

    $("cat").textContent = CATS[h.c];
    $("when").textContent = h.d;
    $("title").textContent = h.t;
    $("body").textContent = h.b;
    $("body").scrollTop = 0;
    $("source").textContent = "Fuente: " + h.s;
    card.style.setProperty("--cat", catColor(h.c));
    yearEl.textContent = h.y;

    // Cielo y sol
    var p = i / (N - 1), sky = skyAt(p);
    player.style.setProperty("--sky-top", sky[0]);
    player.style.setProperty("--sky-mid", sky[1]);
    player.style.setProperty("--sky-low", sky[2]);
    player.style.setProperty("--sun-y", Math.round(46 - p * 52) + "px");

    // Deslizador
    for (var k = 0; k < N; k++) {
      ticks[k].classList.toggle("on", k === i);
      ticks[k].classList.toggle("future", k > i);
    }
    track.setAttribute("aria-valuenow", i + 1);
    track.setAttribute("aria-valuetext", "Hito " + (i + 1) + " de " + N + ": " + h.d + " " + h.y + ", " + h.t);
    $("prev").disabled = i === 0;
    $("next").disabled = i === N - 1;
    listButtons.forEach(function (b, k) { b.setAttribute("aria-current", k === i ? "true" : "false"); });
    $("counter").textContent = (i + 1) + " / " + N;

    if (!reduce && dir !== 0 && card.animate) {
      card.animate(
        [{ opacity: 0, transform: "translateX(" + (dir * 14) + "px)" }, { opacity: 1, transform: "none" }],
        { duration: fromDrag ? 160 : 260, easing: "cubic-bezier(.2,.7,.2,1)" }
      );
      if (prevYear !== h.y && yearEl.animate) {
        yearEl.animate(
          [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
          { duration: 360, easing: "cubic-bezier(.2,.7,.2,1)" }
        );
      }
    }
  }

  // Botones
  $("prev").addEventListener("click", function () { go(cur - 1); });
  $("next").addEventListener("click", function () { go(cur + 1); });

  // Arrastre sobre el deslizador
  function idxFromX(x) {
    var r = track.getBoundingClientRect();
    return Math.floor(Math.max(0, Math.min(.9999, (x - r.left) / r.width)) * N);
  }
  var dragging = false;
  track.addEventListener("pointerdown", function (e) {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    go(idxFromX(e.clientX), true);
  });
  track.addEventListener("pointermove", function (e) { if (dragging) go(idxFromX(e.clientX), true); });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    track.addEventListener(ev, function () { dragging = false; });
  });

  // Deslizar con el dedo sobre la tarjeta
  var sx = null, sy = null;
  card.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; });
  card.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
    sx = sy = null;
  });

  // Teclado
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && indexEl.classList.contains("open")) { toggleIndex(false); indexBtn.focus(); return; }
    if (indexEl.classList.contains("open")) return;
    if (e.key === "ArrowRight") { go(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { go(cur - 1); e.preventDefault(); }
    else if (e.key === "Home") { go(0); e.preventDefault(); }
    else if (e.key === "End") { go(N - 1); e.preventDefault(); }
  });

  // Índice
  function toggleIndex(open) {
    if (typeof open !== "boolean") open = !indexEl.classList.contains("open");
    indexEl.classList.toggle("open", open);
    indexBtn.setAttribute("aria-expanded", open ? "true" : "false");
    $("indexLabel").textContent = open ? "Cerrar" : "Índice";
    if (open) {
      var b = listButtons[cur];
      var ol = $("list");
      ol.scrollTop = Math.max(0, b.parentNode.offsetTop - ol.clientHeight / 2 + b.offsetHeight / 2);
      setTimeout(function () { b.focus({ preventScroll: true }); }, 30);
    }
  }
  indexBtn.addEventListener("click", function () { toggleIndex(); });

  go(0);
})();
</script>
</body>
</html>
