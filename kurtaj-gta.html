<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:var(--f);color:var(--texto);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.lt{background:var(--pantalla);border-radius:14px;overflow:hidden;max-width:820px;margin:0 auto}

/* Cabecera */
.lt-cab{padding:18px 22px 0}
.lt-cab h2{margin:0;font-size:17px;font-weight:700;font-stretch:87.5%;line-height:1.25}
.lt-cab p{margin:3px 0 0;font-size:14px;color:var(--texto-2);line-height:1.4}

/* Pantalla: todas las fichas comparten la misma celda, así el alto no salta */
.lt-pantalla{display:grid;padding:22px 22px 26px;touch-action:pan-y;min-height:0}
.lt-evento{grid-area:1/1;visibility:hidden;opacity:0;min-width:0}
.lt-evento.activo{visibility:visible;opacity:1;animation:entra .3s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:0;transform:translateX(calc(var(--dir,1) * 16px))}to{opacity:1;transform:none}}

.lt-fecha{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:15px;font-weight:600;font-stretch:87.5%;color:var(--c);font-variant-numeric:tabular-nums}
.lt-cat{display:inline-flex;align-items:center;gap:7px;color:var(--texto-2);font-weight:500}
.lt-cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.lt-titulo{margin:8px 0 12px;font-size:clamp(29px,5.6vw,44px);font-weight:700;font-stretch:75%;line-height:1.02;letter-spacing:-.005em;text-wrap:balance}
.lt-texto{margin:0;max-width:62ch;font-size:17px;line-height:1.5;color:var(--cuerpo)}
.lt-dato{margin:18px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.lt-dato b{font-size:clamp(34px,7vw,52px);font-weight:800;font-stretch:75%;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.lt-dato span{max-width:30ch;font-size:15px;line-height:1.35;color:var(--texto-2)}
.lt-cita{margin:18px 0 0;padding-left:14px;border-left:3px solid var(--c)}
.lt-cita p{margin:0;font-size:19px;font-weight:500;font-stretch:87.5%;line-height:1.35}
.lt-cita cite{display:block;margin-top:6px;font-size:14px;font-style:normal;color:var(--texto-2);line-height:1.35}

/* Consola: la barra de capítulos funciona como la de un reproductor de video */
.lt-consola{background:var(--consola);padding:14px 22px 14px}
.lt-capitulo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;font-size:14px;color:var(--texto-2)}
.lt-capitulo strong{margin-right:8px;font-size:15px;font-weight:600;font-stretch:87.5%;color:var(--texto)}
.lt-contador{font-variant-numeric:tabular-nums;white-space:nowrap}

.lt-pista{position:relative;height:34px;cursor:pointer;touch-action:none;outline:none;border-radius:6px}
.lt-pista:focus-visible{box-shadow:0 0 0 2px #fff}
.lt-segmentos{position:absolute;left:0;right:0;top:14px;height:6px;display:flex;gap:4px;transition:transform .15s}
.lt-pista:hover .lt-segmentos,.lt-pista.arrastrando .lt-segmentos{transform:scaleY(1.5)}
.lt-seg{position:relative;height:100%;min-width:0;background:var(--pista);border-radius:3px;overflow:hidden}
.lt-seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(238,240,246,.42)}
.lt-tick{position:absolute;top:17px;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c);opacity:.45;transition:opacity .2s}
.lt-tick.pasado{opacity:1}
.lt-tick.oculto{opacity:.12}
.lt-cabezal{position:absolute;top:17px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);transition:left .25s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.lt-pista.arrastrando .lt-cabezal{transition:none}
.lt-tip{position:absolute;bottom:calc(100% + 4px);left:0;z-index:2;width:max-content;max-width:240px;padding:8px 10px;border-radius:8px;background:#F4F5FA;color:#1A1F33;font-size:13px;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.lt-tip[hidden]{display:none}
.lt-tip b{display:block;font-weight:600;font-stretch:87.5%}

.lt-controles{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-top:8px}
.lt-btn{appearance:none;border:0;margin:0;background:transparent;color:var(--texto);font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:40px;min-width:40px;border-radius:20px}
.lt-btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.lt-btn:disabled{color:#5C6386;cursor:default}
.lt-btn svg{width:20px;height:20px;fill:currentColor}
.lt-play{gap:8px;padding:0 14px 0 11px;background:rgba(255,255,255,.1);font-size:15px;font-weight:600;font-stretch:87.5%}
.lt-play:hover{background:rgba(255,255,255,.16)!important}
.lt-play .ico-pausa,.lt-play[aria-pressed="true"] .ico-play{display:none}
.lt-play[aria-pressed="true"] .ico-pausa{display:block}

.lt-filtros{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.lt-chip{appearance:none;margin:0;font:inherit;font-size:14px;line-height:1;color:var(--texto);background:transparent;border:1px solid #4A5276;border-radius:999px;padding:7px 11px 7px 9px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.lt-chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.lt-chip:hover{border-color:#6B7399}
.lt-chip[aria-pressed="false"]{color:var(--texto-2);border-style:dashed}
.lt-chip[aria-pressed="false"]::before{background:transparent}

.lt-pie{padding:12px 22px 16px;font-size:13px;line-height:1.45;color:var(--texto-2);border-top:1px solid #2D3453;background:var(--consola)}

:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lt-pista:focus-visible{outline:none}

@media (max-width:560px){
  .lt-cab,.lt-pantalla,.lt-consola,.lt-pie{padding-left:16px;padding-right:16px}
  .lt-pantalla{padding-top:18px;padding-bottom:22px}
  .lt-texto{font-size:16px}
  .lt-filtros{margin-left:0;width:100%}
  .lt-capitulo .lt-detalle{display:none}
}
@media (prefers-reduced-motion:reduce){
  .lt-evento.activo{animation:none}
  .lt-cabezal,.lt-segmentos,.lt-tick{transition:none}
}
</style>
</head>

      capNombre = $("lt-cap-nombre"), capDetalle = $("lt-cap-detalle"), contador = $("lt-contador"),
      btnPrev = $("lt-prev"), btnNext = $("lt-next"), btnPlay = $("lt-play"), playTexto = $("lt-play-texto"),
      filtros = $("lt-filtros"), vivo = $("lt-vivo");

  /* Índices por capítulo */
  var porCap = CAPITULOS.map(function(c){ return EVENTOS.filter(function(e){ return e.cap === c.id; }); });
  EVENTOS.forEach(function(e, i){
    e.i = i;
    e.k = CAPITULOS.findIndex(function(c){ return c.id === e.cap; });
    e.j = porCap[e.k].indexOf(e);
    e.n = porCap[e.k].length;
  });

  /* Fichas */
  EVENTOS.forEach(function(e){
    var art = el("article", "lt-evento");
    art.style.setProperty("--c", colorDe(e.tema));
    art.setAttribute("aria-hidden", "true");
    var fecha = el("p", "lt-fecha");
    fecha.appendChild(el("span", null, e.fecha));
    fecha.appendChild(el("span", "lt-cat", TEMAS[e.tema].nombre));
    art.appendChild(fecha);
    art.appendChild(el("h3", "lt-titulo", e.titulo));
    art.appendChild(el("p", "lt-texto", e.texto));
    if (e.dato){
      var d = el("p", "lt-dato");
      d.appendChild(el("b", null, e.dato[0]));
      d.appendChild(el("span", null, e.dato[1]));
      art.appendChild(d);
    }
    if (e.cita){
      var q = el("blockquote", "lt-cita");
      q.appendChild(el("p", null, "“" + e.cita[0] + "”"));
      q.appendChild(el("cite", null, e.cita[1]));
      art.appendChild(q);
    }
    pantalla.appendChild(art);
    e.ficha = art;
  });

  /* Barra de capítulos */
  CAPITULOS.forEach(function(c, k){
    var s = el("div", "lt-seg");
    s.style.flexGrow = porCap[k].length;
    var relleno = el("i");
    s.appendChild(relleno);
    segmentos.appendChild(s);
    c.seg = s; c.relleno = relleno;
  });
  EVENTOS.forEach(function(e){
    var t = el("span", "lt-tick");
    t.style.setProperty("--c", colorDe(e.tema));
    ticks.appendChild(t);
    e.tick = t;
  });

  /* Estado */
  var params = new URLSearchParams(location.search);
  var activos = {};
  var temasParam = (params.get("temas") || "").split(",").filter(function(t){ return TEMAS[t]; });
  Object.keys(TEMAS).forEach(function(t){ activos[t] = temasParam.length ? temasParam.indexOf(t) >= 0 : true; });

  function visibles(){
    return EVENTOS.filter(function(e){ return activos[e.tema]; }).map(function(e){ return e.i; });
  }

  var actual = 0;
  var pedido = params.get("evento");
  if (pedido){
    var num = parseInt(pedido, 10);
    var porId = EVENTOS.findIndex(function(e){ return e.id === pedido; });
    if (porId >= 0) actual = porId;
    else if (!isNaN(num) && num >= 1 && num <= EVENTOS.length) actual = num - 1;
  }
  if (!activos[EVENTOS[actual].tema]) actual = visibles()[0];

  var X = [];
  var reproduciendo = false, temporizador = null;

  function medir(){
    X = EVENTOS.map(function(e){
      var s = CAPITULOS[e.k].seg;
      return s.offsetLeft + s.offsetWidth * (e.j + 0.5) / e.n;
    });
    EVENTOS.forEach(function(e, i){ e.tick.style.left = X[i] + "px"; });
    pintar();
  }

  function pintar(){
    var e = EVENTOS[actual];
    cabezal.style.left = (X[actual] || 0) + "px";
    cabezal.style.setProperty("--c", colorDe(e.tema));
    CAPITULOS.forEach(function(c, k){
      c.relleno.style.transition = "none";
      c.relleno.style.width = k < e.k ? "100%" : k > e.k ? "0%" : ((e.j + 0.5) / e.n * 100) + "%";
    });
    EVENTOS.forEach(function(x, i){
      x.tick.classList.toggle("pasado", i <= actual);
      x.tick.classList.toggle("oculto", !activos[x.tema]);
    });
  }

  function estado(){
    var e = EVENTOS[actual], vis = visibles(), pos = vis.indexOf(actual);
    capNombre.textContent = CAPITULOS[e.k].nombre;
    capDetalle.textContent = CAPITULOS[e.k].detalle;
    contador.textContent = (pos + 1) + " de " + vis.length;
    pista.setAttribute("aria-valuemax", vis.length);
    pista.setAttribute("aria-valuenow", pos + 1);
    pista.setAttribute("aria-valuetext", e.fecha + ": " + e.titulo);
    btnPrev.disabled = pos <= 0;
    btnNext.disabled = pos >= vis.length - 1;
    pintar();
  }

  function ir(i, opciones){
    opciones = opciones || {};
    if (i == null || i === actual && !opciones.inicio) return;
    var anterior = EVENTOS[actual];
    var dir = i > actual ? 1 : -1;
    anterior.ficha.classList.remove("activo");
    anterior.ficha.setAttribute("aria-hidden", "true");
    actual = i;
    var e = EVENTOS[i];
    e.ficha.style.setProperty("--dir", opciones.inicio ? 0 : dir);
    e.ficha.classList.add("activo");
    e.ficha.removeAttribute("aria-hidden");
    estado();
    if (opciones.anunciar) vivo.textContent = e.fecha + ". " + e.titulo;
    if (reproduciendo) programar();
  }

  function paso(d){
    var vis = visibles(), pos = vis.indexOf(actual);
    ir(vis[pos + d], {anunciar:true});
  }

  /* Reproducción */
  function programar(){
    clearTimeout(temporizador);
    var vis = visibles(), pos = vis.indexOf(actual);
    if (pos >= vis.length - 1){ parar(); return; }
    var e = EVENTOS[actual], sig = EVENTOS[vis[pos + 1]], c = CAPITULOS[e.k];
    if (!reduceMov){
      var meta = sig.k === e.k ? (sig.j + 0.5) / sig.n * 100 : 100;
      void c.relleno.offsetWidth;
      c.relleno.style.transition = "width " + DURACION + "ms linear";
      c.relleno.style.width = meta + "%";
    }
    temporizador = setTimeout(function(){ ir(vis[pos + 1]); }, DURACION);
  }
  function reproducir(){
    reproduciendo = true;
    btnPlay.setAttribute("aria-pressed", "true");
    playTexto.textContent = "Pausar";
    var vis = visibles();
    if (actual === vis[vis.length - 1]) ir(vis[0]);
    programar();
  }
  function parar(){
    if (!reproduciendo) return;
    reproduciendo = false;
    clearTimeout(temporizador);
    btnPlay.setAttribute("aria-pressed", "false");
    playTexto.textContent = "Reproducir";
    pintar();
  }

  btnPlay.addEventListener("click", function(){ reproduciendo ? parar() : reproducir(); });
  btnPrev.addEventListener("click", function(){ parar(); paso(-1); });
  btnNext.addEventListener("click", function(){ parar(); paso(1); });

  /* Teclado */
  function saltoCapitulo(d){
    var vis = visibles(), k = EVENTOS[actual].k + d;
    for (; k >= 0 && k < CAPITULOS.length; k += d){
      for (var p = 0; p < vis.length; p++){ if (EVENTOS[vis[p]].k === k) return vis[p]; }
    }
    return null;
  }
  pista.addEventListener("keydown", function(ev){
    var vis = visibles(), pos = vis.indexOf(actual), n;
    switch (ev.key){
      case "ArrowRight": case "ArrowUp": n = vis[pos + 1]; break;
      case "ArrowLeft": case "ArrowDown": n = vis[pos - 1]; break;
      case "Home": n = vis[0]; break;
      case "End": n = vis[vis.length - 1]; break;
      case "PageDown": n = saltoCapitulo(1); break;
      case "PageUp": n = saltoCapitulo(-1); break;
      default: return;
    }
    ev.preventDefault();
    parar();
    ir(n);
  });
  document.addEventListener("keydown", function(ev){
    if (ev.target !== document.body) return;
    if (ev.key === "ArrowRight"){ parar(); paso(1); }
    if (ev.key === "ArrowLeft"){ parar(); paso(-1); }
  });

  /* Arrastre sobre la barra */
  function xDe(ev){ return ev.clientX - pista.getBoundingClientRect().left; }
  function cercano(x){
    var mejor = null, dist = Infinity;
    visibles().forEach(function(i){ var d = Math.abs(X[i] - x); if (d < dist){ dist = d; mejor = i; } });
    return mejor;
  }
  function mostrarTip(i){
    var e = EVENTOS[i];
    tipFecha.textContent = e.fecha;
    tipTitulo.textContent = e.titulo;
    tip.hidden = false;
    var w = tip.offsetWidth, W = pista.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - w, X[i] - w / 2)) + "px";
  }
  var arrastrando = false;
  pista.addEventListener("pointerdown", function(ev){
    arrastrando = true;
    pista.classList.add("arrastrando");
    try { pista.setPointerCapture(ev.pointerId); } catch(err){}
    parar();
    var i = cercano(xDe(ev));
    mostrarTip(i);
    ir(i);
  });
  pista.addEventListener("pointermove", function(ev){
    var i = cercano(xDe(ev));
    if (arrastrando){ mostrarTip(i); ir(i); }
    else if (ev.pointerType === "mouse"){ mostrarTip(i); }
  });
  function soltar(ev){
    arrastrando = false;
    pista.classList.remove("arrastrando");
    if (!ev || ev.pointerType !== "mouse") tip.hidden = true;
  }
  pista.addEventListener("pointerup", soltar);
  pista.addEventListener("pointercancel", soltar);
  pista.addEventListener("pointerleave", function(){ if (!arrastrando) tip.hidden = true; });

  /* Deslizar sobre la ficha en pantallas táctiles */
  var sx = null, sy = null;
  pantalla.addEventListener("pointerdown", function(ev){
    if (ev.pointerType === "mouse") return;
    sx = ev.clientX; sy = ev.clientY;
  });
  pantalla.addEventListener("pointerup", function(ev){
    if (sx == null) return;
    var dx = ev.clientX - sx, dy = ev.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3){ parar(); paso(dx < 0 ? 1 : -1); }
  });
  pantalla.addEventListener("pointercancel", function(){ sx = null; });

  /* Filtros por tema */
  Object.keys(TEMAS).forEach(function(t){
    var b = el("button", "lt-chip", TEMAS[t].nombre);
    b.type = "button";
    b.style.setProperty("--c", colorDe(t));
    b.setAttribute("aria-pressed", activos[t] ? "true" : "false");
    b.addEventListener("click", function(){
      var encendidos = Object.keys(activos).filter(function(x){ return activos[x]; });
      if (activos[t] && encendidos.length === 1) return;
      activos[t] = !activos[t];
      b.setAttribute("aria-pressed", activos[t] ? "true" : "false");
      if (!activos[EVENTOS[actual].tema]){
        var vis = visibles();
        var sig = vis.filter(function(i){ return i > actual; })[0];
        parar();
        ir(sig != null ? sig : vis[vis.length - 1]);
      } else {
        estado();
        if (reproduciendo) programar();
      }
    });
    filtros.appendChild(b);
  });

  /* Alto automático para el iframe */
  function avisarAltura(){
    try {
      window.parent.postMessage({type:"lt-embed-height", height:Math.ceil(document.documentElement.getBoundingClientRect().height)}, "*");
    } catch(err){}
  }

  ir(actual, {inicio:true});
  medir();
  if ("ResizeObserver" in window){
    new ResizeObserver(medir).observe(pista);
    new ResizeObserver(avisarAltura).observe(document.body);
  } else {
    window.addEventListener("resize", function(){ medir(); avisarAltura(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ medir(); avisarAltura(); });
  window.addEventListener("load", avisarAltura);
  avisarAltura();
})();
</script>
</body>
</html>
